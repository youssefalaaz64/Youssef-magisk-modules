<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced App</title>

<style>
:root {
    --bg: #0b1220;
    --card: #111827;
    --text: #e5e7eb;
    --accent: #3b82f6;
}

[data-theme="light"] {
    --bg: #f1f5f9;
    --card: #ffffff;
    --text: #0f172a;
    --accent: #2563eb;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: 0.3s;
}

header {
    padding: 15px 25px;
    display: flex;
    justify-content: space-between;
    background: var(--card);
    align-items: center;
}

nav a {
    color: var(--text);
    text-decoration: none;
    margin-left: 15px;
}

nav a:hover {
    color: var(--accent);
}

main {
    padding: 30px;
    min-height: 80vh;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 15px;
}

button {
    margin-top: 10px;
    padding: 10px 15px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

footer {
    text-align: center;
    padding: 15px;
    background: var(--card);
}
</style>

</head>
<body>

<header>
    <div>App</div>
    <nav>
        <a href="#" onclick="go('home')">Home</a>
        <a href="#" onclick="go('about')">About</a>
        <button onclick="toggleTheme()">Theme</button>
    </nav>
</header>

<main id="app"></main>

<footer></footer>

<script>
const app = document.getElementById("app");

const pages = {
    home: homePage,
    about: aboutPage
};

function homePage() {
    return `
        <div class="card">
            <h2>Home</h2>
            <p>Main content goes here.</p>
            <button onclick="action()">Click</button>
        </div>
    `;
}

function aboutPage() {
    return `
        <div class="card">
            <h2>About</h2>
            <p>About content.</p>
        </div>
    `;
}

function go(page, push = true) {
    if (pages[page]) {
        app.innerHTML = pages[page]();

        if (push) {
            history.pushState({ page }, "", "#" + page);
        }
    }
}

function action() {
    console.log("Action triggered");
}

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    document.documentElement.setAttribute(
        "data-theme",
        current === "light" ? "dark" : "light"
    );
    localStorage.setItem("theme", current === "light" ? "dark" : "light");
}

window.addEventListener("popstate", (e) => {
    go(e.state?.page || "home", false);
});

const savedTheme = localStorage.getItem("theme") || "dark";
document.documentElement.setAttribute("data-theme", savedTheme);

const initial = location.hash.replace("#", "") || "home";
go(initial, false);
</script>

</body>
</html>
