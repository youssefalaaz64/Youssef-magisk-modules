<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Website</title>

<style>
:root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #e2e8f0;
    --accent: #38bdf8;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    padding: 15px;
    background: #020617;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    color: var(--text);
    text-decoration: none;
    margin-right: 15px;
    font-weight: bold;
}

nav a:hover {
    color: var(--accent);
}

main {
    padding: 20px;
    min-height: calc(100vh - 120px);
}

.card {
    background: var(--card);
    padding: 20px;
    margin: 15px 0;
    border-radius: 12px;
}

button {
    padding: 10px 15px;
    border: none;
    background: var(--accent);
    color: black;
    border-radius: 8px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

footer {
    text-align: center;
    padding: 15px;
    background: #020617;
}
</style>

</head>
<body>

<header>
    <nav>
        <div>MySite</div>
        <div>
            <a href="#" onclick="goTo('home')">Home</a>
            <a href="#" onclick="goTo('about')">About</a>
        </div>
    </nav>
</header>

<main id="app"></main>

<footer>
</footer>

<script>
const app = document.getElementById("app");

function goTo(page) {
    if (page === "home") {
        app.innerHTML = `
            <div class="card">
                <h2>Home</h2>
                <p>This is the home page content.</p>
                <button onclick="action()">Click</button>
            </div>
        `;
    }

    if (page === "about") {
        app.innerHTML = `
            <div class="card">
                <h2>About</h2>
                <p>This is the about page.</p>
            </div>
        `;
    }
}

function action() {
    alert("Action triggered");
}

goTo("home");
</script>

</body>
</html>
