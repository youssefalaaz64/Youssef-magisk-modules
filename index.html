<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Site</title>

  <style>
    :root {
      --bg: #ffffff;
      --text: #000000;
      --accent: #000000;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: 2px solid var(--accent);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    .card {
      margin-top: 30px;
      padding: 20px;
      border: 1px solid #ddd;
      border-radius: 10px;
      text-align: left;
    }

    .dark {
      --bg: #121212;
      --text: #ffffff;
      --accent: #ffffff;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1 id="title">Your Custom Site</h1>
    <p id="description">A clean, customizable white page.</p>

    <button onclick="addContent()">Add Content</button>
    <button onclick="toggleTheme()">Toggle Theme</button>

    <div id="content"></div>
  </div>

  <script>
    function addContent() {
      const container = document.getElementById("content");

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h2>New Section</h2>
        <p>You can edit this however you want.</p>
      `;

      container.appendChild(card);
    }

    function toggleTheme() {
      document.body.classList.toggle("dark");
    }
  </script>

</body>
</html>
