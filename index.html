<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blank Editor</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    #editor {
      padding: 40px;
      min-height: 100vh;
      outline: none;
    }

    .topbar {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #eee;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
    }

    .hidden {
      display: none;
    }

    #command {
      position: fixed;
      top: 20%;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: white;
      padding: 10px;
      border-radius: 8px;
      display: none;
      width: 300px;
    }

    #command input {
      width: 100%;
      padding: 8px;
      border: none;
      outline: none;
    }

    .cmd-item {
      padding: 5px;
      cursor: pointer;
    }

    .cmd-item:hover {
      background: #444;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <button onclick="newPage()">New</button>
    <button onclick="save()">Save</button>
    <button onclick="exportFile()">Export</button>
    <button onclick="toggleFocus()">Focus</button>
  </div>

  <div id="editor" contenteditable="true"></div>

  <div id="command">
    <input id="cmdInput" placeholder="Type command..." oninput="filterCommands()">
    <div id="cmdList"></div>
  </div>

  <script>
    const editor = document.getElementById("editor");
    let currentPage = "page_1";
    let history = [];
    let historyIndex = -1;

    function save() {
      localStorage.setItem(currentPage, editor.innerHTML);
      localStorage.setItem("backup_" + currentPage, editor.innerHTML);
    }

    function load(name) {
      currentPage = name;
      editor.innerHTML = localStorage.getItem(name) || "";
      resetHistory();
    }

    function newPage() {
      currentPage = "page_" + Date.now();
      editor.innerHTML = "";
      save();
    }

    function exportFile() {
      const blob = new Blob([editor.innerHTML], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = currentPage + ".html";
      a.click();
    }

    function toggleFocus() {
      document.querySelector(".topbar").classList.toggle("hidden");
    }

    function pushHistory() {
      history = history.slice(0, historyIndex + 1);
      history.push(editor.innerHTML);
      historyIndex++;
    }

    function undo() {
      if (historyIndex > 0) {
        historyIndex--;
        editor.innerHTML = history[historyIndex];
      }
    }
