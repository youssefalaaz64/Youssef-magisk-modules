
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blank Editor</title>

  <style>
    body {
      margin: 0;
      background: white;
      font-family: Arial, sans-serif;
    }

    #editor {
      padding: 40px;
      min-height: 100vh;
      outline: none;
    }

    .panel {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #f2f2f2;
      padding: 10px;
      border-radius: 8px;
    }

    .panel button {
      margin: 3px;
      padding: 5px 8px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .page {
      cursor: pointer;
      padding: 3px;
      font-size: 13px;
    }

    .page:hover {
      background: #ddd;
    }
  </style>
</head>

<body>

  <div class="panel">
    <button onclick="newPage()">New</button>
    <button onclick="copyPage()">Copy</button>
    <button onclick="deletePage()">Delete</button>
    <button onclick="togglePanel()">Hide</button>

    <div id="pages"></div>
  </div>

  <div id="editor" contenteditable="true"></div>

  <script>
    let current = "page1";

    function save() {
      localStorage.setItem(current, document.getElementById("editor").innerHTML);
    }

    function load(name) {
      current = name;
      document.getElementById("editor").innerHTML = localStorage.getItem(name) || "";
    }

    function refreshList() {
      const container = document.getElementById("pages");
      container.innerHTML = "";

      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);

        const div = document.createElement("div");
        div.className = "page";
        div.textContent = key;

        div.onclick = () => load(key);
        container.appendChild(div);
      }
    }

    function newPage() {
      const name = "page_" + Date.now();
      localStorage.setItem(name, "");
      refreshList();
      load(name);
    }

    function copyPage() {
      const newName = current + "_copy";
      localStorage.setItem(newName, localStorage.getItem(current));
      refreshList();
    }

    function deletePage() {
      localStorage.removeItem(current);
      refreshList();
      const keys = Object.keys(localStorage);
      if (keys.length > 0) load(keys[0]);
      else document.getElementById("editor").innerHTML = "";
    }

    function togglePanel() {
      document.querySelector(".panel").classList.toggle("hidden");
    }

    // auto save
    setInterval(save, 1500);

    refreshList();
    if (localStorage.getItem(current)) {
      load(current);
    } else {
      localStorage.setItem(current, "");
    }
  </script>

</body>
</html>
